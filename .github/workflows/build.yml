
name: Build Tarek Memo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d project
          WRAPPER=$(find project -name gradlew -type f | head -1)
          test -n "$WRAPPER"
          chmod +x "$WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarek-Memo-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
